/* Mileage logic */
function getMonthlyMiles(vehicleId){
  const logs=[...db.mileageLogs.filter(l=>l.vehicleId===vehicleId)].sort((a,b)=>a.date.localeCompare(b.date));
  const result=[];
  for(let i=1;i<logs.length;i++){
    const prev=logs[i-1],curr=logs[i];
    const miles=curr.odo-prev.odo;
    const days=daysBetween(curr.date,prev.date)||30;
    result.push({from:prev.date,to:curr.date,miles,days,avgPerDay:miles/days,prevOdo:prev.odo,currOdo:curr.odo});
  }
  // Current month (from last log to today with current odo)
  if(logs.length){
    const last=logs[logs.length-1];
    const currOdo=v()?.odo||last.odo;
    const currDate=today();
    if(currDate!==last.date){
      const miles=currOdo-last.odo;
      const days=daysBetween(currDate,last.date)||1;
      result.push({from:last.date,to:currDate,miles,days,avgPerDay:miles/days,prevOdo:last.odo,currOdo,current:true});
    }
  }
  return result;
}
function getAvgMonthlyMiles(vehicleId){
  const monthly=getMonthlyMiles(vehicleId);
  if(!monthly.length)return 0;
  const last3=monthly.slice(-3);
  return last3.reduce((a,b)=>a+b.miles,0)/last3.length;
}

function reminderCards(a){return `<div class="mini-list">${a.map(r=>{let s=reminderStatus(r);let due=[];if(r.nextMileage)due.push(Number(r.nextMileage).toLocaleString()+' '+(v().unit||''));if(r.nextDate)due.push(r.nextDate);return `<div class="mini" onclick="editReminder('${r.id}')" style="cursor:pointer"><div><b>${esc(r.name)}</b><span>${due.join(' · ')} · ${esc(r.type||'')}</span></div><span class="badge ${s[1]}">${s[0]}</span></div>`}).join('')}</div>`}
function assistant(x,rec,rem,iss,monthlyData,avgMonthly){
  let out=[];
  const due=rem.filter(r=>r.name!=='Actualizar kilometraje mensual'&&reminderStatus(r)[1]!=='ok');
  if(due.length)out.push(`<b>Atención:</b> ${due.length} servicios próximos o vencidos. Revisa pestaña Servicios.`);
  if(avgMonthly>1500)out.push(`<b>Uso alto:</b> ${Math.round(avgMonthly).toLocaleString()} mi/mes es uso intenso. Reduce intervalo de aceite a 5,000 mi.`);
  else if(avgMonthly>0&&avgMonthly<300)out.push(`<b>Uso bajo:</b> ${Math.round(avgMonthly)} mi/mes. Cambia aceite mínimo cada 6 meses aunque no llegues a millas.`);
  const open=iss.filter(i=>i.status!=='resuelto');if(open.length)out.push(`<b>Diagnóstico:</b> ${open.length} problemas abiertos.`);
  if(monthlyData.length>=2){
    const last=monthlyData[monthlyData.length-1],prev=monthlyData[monthlyData.length-2];
    const diff=last.miles-prev.miles;
    if(Math.abs(diff)>300)out.push(`<b>Variación:</b> este mes recorriste ${diff>0?'+':''}${diff} mi vs mes anterior.`);
  }
  if(!out.length)out.push(`<b>Todo en orden:</b> ${Math.round(avgMonthly)} mi/mes promedio. Mantén actualización mensual de millas.`);
  return `<div class="rows">${out.map(s=>`<div class="notice">${s}</div>`).join('')}</div>`;
}

function recordTable(a){if(!a.length)return `<div class="empty">Sin registros<br><button onclick="recordForm()">Registrar primer servicio</button></div>`;a=[...a].sort((x,y)=>y.date.localeCompare(x.date));return `<div class="table"><table><thead><tr><th>Fecha</th><th>Trabajo</th><th>Cat</th><th>Costo</th><th></th></tr></thead><tbody>${a.map(r=>`<tr><td>${esc(r.date)}<br><small>${Number(r.odo).toLocaleString()}</small></td><td><b>${esc(r.service)}</b><br><span class="sub">${esc(r.shop||'')}${r.notes?' · '+esc(r.notes.slice(0,50)):''}</span></td><td>${esc(r.category||'')}</td><td>${money(r.cost)}</td><td><div style="display:flex;gap:4px"><button class="secondary" onclick="editRecord('${r.id}')">✎</button><button class="danger" style="border:0;background:var(--badBg);color:#ffb4b8;padding:6px 8px;border-radius:8px" onclick="delRecord('${r.id}')">×</button></div></td></tr>`).join('')}</tbody></table></div>`}
function mileageTable(logs,monthly){
  if(!logs.length)return `<div class="empty">Sin registros de millas. Usa ＋ Millas para empezar.</div>`;
  logs=[...logs].sort((a,b)=>b.date.localeCompare(a.date));
  return `<div class="table"><table><thead><tr><th>Fecha</th><th>Odo</th><th>Recorrido</th><th>Notas</th><th></th></tr></thead><tbody>${logs.map((l,i)=>{
    const next=logs[i-1]; // because sorted desc
    const prev=logs[i+1];
    // Actually monthly array has calculated miles, match by date
    const m=monthly.find(mm=>mm.to===l.date||mm.from===l.date);
    const milesFromPrev=prev? l.odo-prev.odo : 0;

function openMileageModal(data={}){
  const edit=!!data.id;
  const lastOdo=v()?.odo||0;
  modal(`<h2>${edit?'Editar':'Registrar'} millas recorridas</h2>
    <div class="notice" style="margin-bottom:12px">Registra tu kilometraje actual cada mes. Así calculamos millas por mes, promedio y cuándo te toca el próximo servicio.</div>
    <form onsubmit="saveMileage(event,'${data.id||''}')">
    <div class="formgrid">
      <label>Fecha<input name="date" type="date" required value="${esc(data.date||today())}"></label>
      <label>Odómetro actual<input name="odo" type="number" required value="${esc(data.odo??lastOdo)}" min="0"></label>
      <label class="full">Notas (opcional)<input name="notes" value="${esc(data.notes||'')}" placeholder="Ej. Fin de mes, viaje a Tijuana, etc."></label>
      <div class="full notice" id="mileageCalc" style="display:none"></div>
    </div>
    <div style="margin-top:12px;display:flex;gap:8px"><button>Guardar millas</button><button type="button" class="secondary" onclick="closeModal()">Cancelar</button></div>
    </form>
    <div class="sub" style="margin-top:10px">Últimos registros: ${(db.mileageLogs.filter(l=>l.vehicleId===selected).slice(-3).map(l=>`${l.date}: ${Number(l.odo).toLocaleString()}`).join(' · ')||'—')}</div>
  `);
  const odoInput=document.querySelector('input[name="odo"]');const dateInput=document.querySelector('input[name="date"]');
  function calc(){
    const val=Number(odoInput.value||0);const lastLog=[...db.mileageLogs.filter(l=>l.vehicleId===selected)].sort((a,b)=>b.date.localeCompare(a.date))[0];
    if(lastLog&&val){const diff=val-lastLog.odo;const days=daysBetween(dateInput.value||today(),lastLog.date)||1;document.getElementById('mileageCalc').style.display='block';document.getElementById('mileageCalc').innerHTML=`Recorriste <b>${diff.toLocaleString()} ${(v().unit||'mi')}</b> en ${days} días · Promedio ${(diff/days).toFixed(1)}/día`;}
  }
  odoInput.addEventListener('input',calc);calc();
}
function saveMileage(e,editId){
  e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.odo=+o.odo||0;o.vehicleId=selected;
  if(o.odo < (v()?.odo||0) - 1000 && !confirm(`Tu odómetro actual es ${v()?.odo}. Estás guardando ${o.odo}, ¿es correcto?`))return;
  if(editId){Object.assign(db.mileageLogs.find(x=>x.id===editId),o)}else{o.id='ml-'+Date.now();db.mileageLogs.push(o);if(o.odo>v().odo)v().odo=o.odo}
  closeModal();save();toast(`Millas guardadas: ${o.odo.toLocaleString()} · +${(() => {const logs=[...db.mileageLogs.filter(l=>l.vehicleId===selected)].sort((a,b)=>a.date.localeCompare(b.date));if(logs.length<2)return 0;const prev=logs[logs.length-2];return o.odo-prev.odo})()} mi este periodo`,'ok');
  // Check monthly reminder completion
  const monthlyRem=db.reminders.find(r=>r.vehicleId===selected&&r.name==='Actualizar kilometraje mensual');
  if(monthlyRem){monthlyRem.completedAt=today();const d=new Date();d.setMonth(d.getMonth()+1);d.setDate(1);monthlyRem.nextDate=d.toISOString().slice(0,10);save();}
}

  `);

function exportMonthlyCSV(){
  const x=v();const monthly=getMonthlyMiles(x.id);if(!monthly.length){toast('Sin datos','warn');return}
  const csv=['Fecha Inicio,Fecha Fin,Odometro Inicio,Odometro Fin,Millas Recorridas,Dias,Promedio por Dia'].concat(monthly.map(m=>`${m.from},${m.to},${m.prevOdo},${m.currOdo},${m.miles},${m.days},${m.avgPerDay.toFixed(2)}`)).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Reporte_Millas_${x.make}_${today()}.csv`;a.click();toast('CSV mensual exportado','ok');
}

const SERVICE_MAP=[
  {kw:['aceite','oil'],name:'Cambio de aceite y filtro',miles:7500,months:6},
  {kw:['filtro de aire','air filter'],name:'Cambio filtro de aire motor',miles:15000,months:12},
  {kw:['bujía','spark','bujia'],name:'Cambio de bujías',miles:30000,months:24},
  {kw:['frenos','pastilla','balata','rotor'],name:'Inspección de frenos',miles:15000,months:12},
  {kw:['transmisión','transmision'],name:'Cambio fluido transmisión',miles:40000,months:36},
  {kw:['anticongelante','refrigerante'],name:'Cambio anticongelante',miles:30000,months:24},
  {kw:['llantas','rotación'],name:'Rotación de llantas',miles:7500,months:6},
];
function autoCreateReminderFromService(record){
  const txt=(record.service+' '+record.category).toLowerCase();
  for(const m of SERVICE_MAP){if(m.kw.some(k=>txt.includes(k))){const exists=db.reminders.some(r=>r.vehicleId===record.vehicleId&&r.name.toLowerCase().includes(m.name.toLowerCase().split(' ')[0])&&r.id!=='m-monthly');if(!exists){const nextMiles=Number(v().odo||record.odo)+m.miles;const d=new Date();d.setMonth(d.getMonth()+m.months);db.reminders.push({id:'m-'+Date.now()+Math.random().toString(16).slice(2),vehicleId:record.vehicleId,name:m.name,nextMileage:nextMiles,nextDate:d.toISOString().slice(0,10),warnMiles:800,warnDays:30,type:'Reemplazo',source:'E.O. IA',intervalMiles:m.miles,intervalMonths:m.months,status:'pending',notes:`Auto tras: ${record.service}`});toast(`🧠 Recordatorio creado: ${m.name}`,'ok');}break;}}
}
function generateSmartReminders(){let c=0;db.records.forEach(r=>{const b=db.reminders.length;autoCreateReminderFromService(r);if(db.reminders.length>b)c++;});if(c){save();toast(`IA generó ${c} recordatorios`,'ok');}else toast('Todo al día','info');}


/* Inspections */
function openInspectionForm(data={}){
  const edit=!!data.id;
  const existingItems = data.items || [];
  // Build checklist with existing status
  let htmlItems = '';
  INSPECTION_TEMPLATE.forEach((group,gIdx)=>{
    htmlItems+=`<div style="margin-top:14px"><div class="eyebrow" style="color:var(--gold)">${esc(group.cat)}</div><div style="display:grid;gap:8px;margin-top:8px">`;
    group.items.forEach((itemName,iIdx)=>{
      const key=`${gIdx}-${iIdx}`;
      const existing = existingItems.find(it=>it.name===itemName) || {name:itemName,status:'pendiente',notes:''};
      htmlItems+=`<div class="row" style="padding:8px 0"><span style="flex:1"><b style="font-size:12.5px">${esc(itemName)}</b></span><select id="ins-${key}-status" style="width:130px"><option value="pendiente" ${existing.status==='pendiente'?'selected':''}>Pendiente</option><option value="ok" ${existing.status==='ok'?'selected':''}>✓ OK</option><option value="atencion" ${existing.status==='atencion'?'selected':''}>⚠ Atención</option><option value="no_aplica" ${existing.status==='no_aplica'?'selected':''}>— N/A</option></select><input id="ins-${key}-notes" placeholder="Nota" value="${esc(existing.notes||'')}" style="width:140px"></div>`;
    });
    htmlItems+=`</div></div>`;
  });

  modal(`<h2>${edit?'Editar':'Nueva'} inspección - 28 puntos</h2><form onsubmit="saveInspection(event,'${data.id||''}')">
    <div class="formgrid">
      <label>Fecha<input name="date" type="date" required value="${esc(data.date||today())}"></label>
      <label>Odómetro<input name="odo" type="number" required value="${esc(data.odo??v().odo)}"></label>
      <label class="full">Notas generales<textarea name="notes" placeholder="Ruido al frenar, vibración 60-80, etc.">${esc(data.notes||'')}</textarea></label>
    </div>
    ${htmlItems}
    <div style="margin-top:16px;display:flex;gap:8px"><button>Guardar inspección</button><button type="button" class="secondary" onclick="closeModal()">Cancelar</button></div>
  </form>`);
}
function saveInspection(e,editId){
  e.preventDefault();
  const fd=new FormData(e.target);
  const o={date:fd.get('date')||today(),odo:+(fd.get('odo')||0),notes:fd.get('notes')||'',vehicleId:selected};
  const items=[];
  INSPECTION_TEMPLATE.forEach((group,gIdx)=>{
    group.items.forEach((itemName,iIdx)=>{
      const key=`${gIdx}-${iIdx}`;
      const status=document.getElementById(`ins-${key}-status`)?.value||'pendiente';
      const notes=document.getElementById(`ins-${key}-notes`)?.value||'';
      items.push({cat:group.cat,name:itemName,status,notes});
    });
  });
  o.items=items;
  const atencion=items.filter(it=>it.status==='atencion').length;
  const ok=items.filter(it=>it.status==='ok').length;
  o.overallStatus= atencion>0 ? `atencion (${atencion} puntos)` : `ok (${ok}/${items.length})`;
  if(editId){Object.assign(db.inspections.find(x=>x.id===editId),o)}else{o.id='insp-'+Date.now();db.inspections.push(o);if(o.odo>v().odo)v().odo=o.odo}
  closeModal();save();toast(`Inspección guardada: ${o.overallStatus}`,'ok');
}
function editInspection(id){openInspectionForm(db.inspections.find(x=>x.id===id))}
function delInspection(id){if(confirm('¿Eliminar inspección?')){db.inspections=db.inspections.filter(x=>x.id!==id);save();toast('Eliminada','bad')}}

/* PDF Exports */
function exportPDFServicios(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const x=v();
  const rem=db.reminders.filter(r=>r.vehicleId===x.id);
  const pending=rem.filter(r=>reminderStatus(r)[1]!=='ok');
  const monthly=getMonthlyMiles(x.id);
  const avg=getAvgMonthlyMiles(x.id);
  
  // Header
  doc.setFillColor(8,10,13);doc.rect(0,0,210,22,'F');
  doc.setTextColor(217,180,106);doc.setFontSize(14);doc.setFont('helvetica','bold');doc.text('E.O. Garage - Servicios Pendientes',14,14);
  doc.setTextColor(255,255,255);doc.setFontSize(9);doc.text(`Build 15.0 Super Pro Personal - ${today()}`,150,14);
  
  // Vehicle info
  doc.setTextColor(0,0,0);doc.setFontSize(11);doc.setFont('helvetica','bold');doc.text(`${x.make} ${x.model} ${x.year}`,14,32);
  doc.setFontSize(9);doc.setFont('helvetica','normal');
  doc.text(`VIN: ${x.vin||'—'}`,14,38);
  doc.text(`Motor: ${x.engine||'—'} | ${x.drive||''} | ${x.tire||''}`,14,43);
  doc.text(`Odo actual: ${Number(x.odo).toLocaleString()} ${x.unit||'mi'} | Promedio: ${Math.round(avg).toLocaleString()} mi/mes`,14,48);
  doc.text(`Fecha reporte: ${today()} | Total millas registradas: ${monthly.reduce((a,b)=>a+b.miles,0).toLocaleString()} mi`,14,53);
  
  // Pending services
  doc.setFontSize(12);doc.setFont('helvetica','bold');doc.text('Servicios que requiere la camioneta:',14,64);
  let y=72;
  if(!pending.length){
    doc.setFontSize(10);doc.setFont('helvetica','normal');doc.text('✓ No hay servicios pendientes. Todo al día.',14,y);
    y+=8;
  } else {
    doc.setFontSize(9);doc.setFont('helvetica','bold');
    doc.text('Servicio',14,y);doc.text('Próximo',90,y);doc.text('Estado',130,y);doc.text('Notas',155,y);
    y+=4;doc.line(14,y,196,y);y+=5;
    doc.setFont('helvetica','normal');
    pending.forEach(r=>{
      if(y>270){doc.addPage();y=20;}
      const status=reminderStatus(r)[0];
      const next=r.nextMileage? Number(r.nextMileage).toLocaleString()+' '+(x.unit||'mi') : (r.nextDate||'—');
      const interval=(r.intervalMiles? r.intervalMiles+' mi' : '') + (r.intervalMonths? ' / '+r.intervalMonths+' meses' : '');
      doc.text(r.name.substring(0,40),14,y);
      doc.text(next,90,y);
      doc.text(status,130,y);
      doc.text((r.notes||interval||'').substring(0,30),155,y);
      y+=6;
      // Estimated date
      if(r.nextMileage&&avg){
        const remaining=r.nextMileage - x.odo;
        if(remaining>0){
          const months=remaining/avg;
          const estDate=new Date();estDate.setMonth(estDate.getMonth()+months);
          doc.setFontSize(7);doc.setTextColor(100,100,100);
          doc.text(`Estimado: ${estDate.toLocaleDateString('es-MX')} (en ${months.toFixed(1)} meses)`,14,y);
          doc.setFontSize(9);doc.setTextColor(0,0,0);
          y+=4;
        }
      }
    });
  }
  
  // Monthly summary
  y+=6;if(y>250){doc.addPage();y=20;}
  doc.setFontSize(11);doc.setFont('helvetica','bold');doc.text('Resumen de uso mensual:',14,y);y+=8;
  doc.setFontSize(8);doc.setFont('helvetica','normal');
  monthly.slice(-6).reverse().forEach(m=>{
    if(y>280){doc.addPage();y=20;}
    doc.text(`${m.from} → ${m.to}: ${m.miles.toLocaleString()} mi en ${m.days} días (prom ${m.avgPerDay.toFixed(1)}/día)`,14,y);
    y+=5;
  });
  
  // Footer
  doc.setFontSize(8);doc.setTextColor(100,100,100);
  doc.text(`E.O. Garage v15 Super Pro Final | ${x.make} ${x.model} | Generado ${new Date().toLocaleString('es-MX')} | Para mecánico`,14,290);
  
  doc.save(`Servicios_${x.make}_${x.model}_${today()}.pdf`);
  toast('PDF de servicios generado para mecánico','ok');
}

function exportPDFChecklist(inspectionId=null){

  const doc = new jsPDF();
  const x=v();
  let insp=null;
  if(inspectionId) insp=db.inspections.find(i=>i.id===inspectionId);

  if(!insp){toast('No hay inspección para exportar. Crea una primero.','warn');return;}

  doc.setTextColor(217,180,106);doc.setFontSize(14);doc.setFont('helvetica','bold');doc.text('Checklist Inspección 28 Puntos',14,14);

  doc.save(`Checklist_${x.make}_${insp.date}.pdf`);
  toast('PDF Checklist generado','ok');
}


/* Super Pro - Health Semaphore */
function getHealthByCategory(vehicleId){
  const ins=[...db.inspections.filter(i=>i.vehicleId===vehicleId)].sort((a,b)=>b.date.localeCompare(a.date))[0];
  if(!ins||!ins.items.length) return null;
  const byCat={};
  ins.items.forEach(it=>{
    if(!byCat[it.cat]) byCat[it.cat]={total:0,ok:0,atencion:0};
    byCat[it.cat].total++;
    if(it.status==='ok') byCat[it.cat].ok++;
    if(it.status==='atencion') byCat[it.cat].atencion++;
  });
  Object.keys(byCat).forEach(c=>{
    const d=byCat[c];
    d.pct = d.total? Math.round((d.ok/d.total)*100) : 0;
    d.status = d.atencion>0 ? (d.pct<60?'bad':'warn') : 'ok';
  });
  return byCat;
}
function renderHealthSemaphore(){
  const health=getHealthByCategory(selected);
  if(!health) return '<div class="notice">Haz una inspección para ver salud por categoría</div>';
  return '<div class="grid" style="grid-template-columns:repeat(3,1fr)">'+Object.entries(health).map(([cat,data])=>`
    <div class="stat" style="border-color:${data.status==='ok'?'#1e4a32':data.status==='warn'?'#4a3f1e':'#5a2a2d'}">
      <div style="display:flex;justify-content:space-between"><span style="font-size:11px;font-weight:800">${cat}</span><span class="badge ${data.status}">${data.pct}%</span></div>
      <div style="margin-top:6px;height:6px;background:#1f2730;border-radius:999px;overflow:hidden"><div style="width:${data.pct}%;height:100%;background:${data.status==='ok'?'var(--ok)':data.status==='warn'?'var(--warn)':'var(--bad)'}"></div></div>
      <div class="sub" style="margin-top:4px">${data.ok}/${data.total} OK · ${data.atencion} atención</div>
    </div>`).join('')+'</div>';
}

function uuid(id){return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(id||''))?id:crypto.randomUUID()}
async function syncTable(table,rows,mapFn){const existing=await sb.from(table).select('id').eq('owner_id',cloudUser.id);if(existing.error)throw existing.error;const keep=new Set();const payload=rows.map(r=>{const id=uuid(r.id);r.id=id;keep.add(id);return mapFn(r,id)});if(payload.length){const {error}=await sb.from(table).upsert(payload,{onConflict:'id'});if(error)throw error}for(const row of existing.data||[]){if(!keep.has(row.id)){await sb.from(table).delete().eq('owner_id',cloudUser.id).eq('id',row.id)}}}
async function cloudSave(force=false){
  if(!cloudUser||(!cloudReady&&!force))return;if(cloudSyncing){saveQueue=true;return}cloudSyncing=true;
  try{
    setCloudStatus('☁️ Guardando…');
    const idMap=new Map();for(const r of db.vehicles){const old=r.id;const id=uuid(old);if(old!==id)idMap.set(old,id);r.id=id}
    if(idMap.size){const remap=arr=>arr.forEach(r=>{if(idMap.has(r.vehicleId))r.vehicleId=idMap.get(r.vehicleId)});remap(db.records);remap(db.reminders);remap(db.issues);remap(db.expenses);remap(db.mileageLogs)}
    await syncTable('eo_garage_vehicles',db.vehicles,(r,id)=>({id,owner_id:cloudUser.id,make:r.make,model:r.model,model_year:Number(r.year)||null,vin:r.vin||null,engine:r.engine||null,drivetrain:r.drive||null,current_mileage:Number(r.odo)||0,tire_size:r.tire||null,tire_pressure_psi:r.tirePressure?Number(r.tirePressure):null,oil_brand:r.oil||null,oil_viscosity:r.oilViscosity||null,oil_filter_brand:r.oilFilter||null,spark_plug_brand:r.spark||null,notes:r.notes||null,service_notes:r.serviceNotes||null}));
    await syncTable('eo_garage_maintenance',db.records,(r,id)=>({id,owner_id:cloudUser.id,vehicle_id:r.vehicleId,service_date:r.date||today(),mileage:Number(r.odo)||null,category:r.category||'Mantenimiento',description:r.service||'Trabajo',brand:r.parts||null,part_number:r.partNumber||null,cost:Number(r.cost)||0,shop:r.shop||null,notes:r.notes||null}));
    await syncTable('eo_garage_reminders',db.reminders,(r,id)=>({id,owner_id:cloudUser.id,vehicle_id:r.vehicleId,title:r.name||'Servicio',category:r.type||null,interval_miles:r.intervalMiles?Number(r.intervalMiles):null,interval_months:r.intervalMonths?Number(r.intervalMonths):null,due_mileage:r.nextMileage?Number(r.nextMileage):null,due_date:r.nextDate||null,status:r.status||'pending',notes:r.notes||null}));
    await syncTable('eo_garage_issues',db.issues,(r,id)=>({id,owner_id:cloudUser.id,vehicle_id:r.vehicleId,title:r.title||'Problema',description:r.description||null,priority:r.severity||'normal',status:r.status==='resuelto'?'resuelto':(r.status==='en observación'?'en observación':'abierto'),diagnosed_at:r.date||null,notes:r.notes||null,cost:Number(r.cost)||0}));
    await syncTable('eo_garage_expenses',db.expenses,(r,id)=>({id,owner_id:cloudUser.id,vehicle_id:r.vehicleId,expense_date:r.date||today(),mileage:Number(r.odo)||null,category:r.category||'Otro',description:r.description||'Gasto',amount:Number(r.amount)||0,notes:r.notes||null}));
    try{await syncTable('eo_garage_mileage_logs',db.mileageLogs,(r,id)=>({id,owner_id:cloudUser.id,vehicle_id:r.vehicleId,log_date:r.date||today(),mileage:Number(r.odo)||0,notes:r.notes||null}));}catch(e){console.warn('mileage table missing',e.message)}
    try{await syncTable('eo_garage_inspections',db.inspections,(r,id)=>({id,owner_id:cloudUser.id,vehicle_id:r.vehicleId,inspection_date:r.date||today(),mileage:Number(r.odo)||0,items:JSON.stringify(r.items||[]),notes:r.notes||null,overall_status:r.overallStatus||'pendiente'}));}catch(e){console.warn('inspections table missing',e.message)}
    localStorage.setItem(KEY,JSON.stringify(db));setCloudStatus('☁️ Nube conectada');
  }catch(e){console.error(e);setCloudStatus('⚠️ Local');toast('Error nube','bad')}finally{cloudSyncing=false;if(saveQueue){saveQueue=false;setTimeout(()=>cloudSave(true),500)}}
}
async function loadCloudToLocal(){
  const qv=await sb.from('eo_garage_vehicles').select('*').order('created_at',{ascending:true});if(qv.error)throw qv.error;if(!qv.data.length){await cloudSave(true);cloudReady=true;return}
  const vehicles=qv.data.map(x=>({id:x.id,make:x.make,model:x.model,year:x.model_year,vin:x.vin||'',engine:x.engine||'',drive:x.drivetrain||'',odo:x.current_mileage||0,unit:'mi',fuel:'Gasolina',tire:x.tire_size||'',tirePressure:x.tire_pressure_psi||'',oil:x.oil_brand||'',oilViscosity:x.oil_viscosity||'',oilFilter:x.oil_filter_brand||'',spark:x.spark_plug_brand||'',notes:x.notes||'',serviceNotes:x.service_notes||''}));
  const ids=vehicles.map(x=>x.id);
  const [qm,qr,qi,qe,qml,qin]=await Promise.all([
    sb.from('eo_garage_maintenance').select('*').in('vehicle_id',ids).order('service_date',{ascending:false}),
    sb.from('eo_garage_reminders').select('*').in('vehicle_id',ids),
    sb.from('eo_garage_issues').select('*').in('vehicle_id',ids),
    sb.from('eo_garage_expenses').select('*').in('vehicle_id',ids).order('expense_date',{ascending:false}),
    sb.from('eo_garage_mileage_logs').select('*').in('vehicle_id',ids).order('log_date',{ascending:true}).then(r=>r).catch(()=>({data:[],error:null})),
    sb.from('eo_garage_inspections').select('*').in('vehicle_id',ids).order('inspection_date',{ascending:false}).then(r=>r).catch(()=>({data:[],error:null}))
  ]);

/* Mileage logic */
function getMonthlyMiles(vehicleId){
  const logs=[...db.mileageLogs.filter(l=>l.vehicleId===vehicleId)].sort((a,b)=>a.date.localeCompare(b.date));
  const result=[];
  for(let i=1;i<logs.length;i++){
    const prev=logs[i-1],curr=logs[i];
    const miles=curr.odo-prev.odo;
    const days=daysBetween(curr.date,prev.date)||30;
    result.push({from:prev.date,to:curr.date,miles,days,avgPerDay:miles/days,prevOdo:prev.odo,currOdo:curr.odo});
  }
  // Current month (from last log to today with current odo)
  if(logs.length){
    const last=logs[logs.length-1];
    const currOdo=v()?.odo||last.odo;
    const currDate=today();
    if(currDate!==last.date){
      const miles=currOdo-last.odo;
      const days=daysBetween(currDate,last.date)||1;
      result.push({from:last.date,to:currDate,miles,days,avgPerDay:miles/days,prevOdo:last.odo,currOdo,current:true});
    }
  }
  return result;
}
function getAvgMonthlyMiles(vehicleId){
  const monthly=getMonthlyMiles(vehicleId);
  if(!monthly.length)return 0;
  const last3=monthly.slice(-3);
  return last3.reduce((a,b)=>a+b.miles,0)/last3.length;
}

    let next=[...rem].filter(r=>r.name!=='Actualizar kilometraje mensual').sort((a,b)=>{const o={bad:0,warn:1,ok:2};return o[reminderStatus(a)[1]]-o[reminderStatus(b)[1]]}).slice(0,4);
    const monthlyRem=rem.find(r=>r.name==='Actualizar kilometraje mensual');
    return `<div class="split">
      <div class="card section"><div class="section-head"><div><div class="eyebrow">Tu uso real</div><h2>Millas por mes</h2></div><button class="secondary" onclick="openMileageModal()">＋ Actualizar</button></div>
        <div class="chart-wrap"><canvas id="chartMiles"></canvas></div>
        <div class="rows" style="margin-top:12px">
          <div class="row"><span>Promedio últimos 3 meses</span><b>${Math.round(avgMonthly).toLocaleString()} ${(x.unit||'mi')}/mes</b></div>
          <div class="row"><span>Promedio por día</span><b>${(avgMonthly/30).toFixed(1)} ${(x.unit||'mi')}/día</b></div>
          <div class="row"><span>Proyección anual</span><b>${Math.round(avgMonthly*12).toLocaleString()} ${(x.unit||'mi')}/año</b></div>
          <div class="row"><span>Próximo cambio aceite estimado</span><b>${(() => {
            const oilRem=rem.find(r=>r.name.toLowerCase().includes('aceite'));
            if(!oilRem||!oilRem.nextMileage)return '—';
            const remaining=oilRem.nextMileage - x.odo;
            const months=avgMonthly? (remaining/avgMonthly).toFixed(1) : '—';
            return `${oilRem.nextMileage.toLocaleString()} mi · en ~${months} meses`;
          })()}</b></div>
        </div>
      </div>
      <div class="card section"><div class="eyebrow">Próximo</div><h2>Servicios preventivos</h2>${next.length?reminderCards(next):'<div class="empty">Sin alertas</div>'}${monthlyRem?`<div style="margin-top:12px"><div class="eyebrow">Mensual</div>${reminderCards([monthlyRem])}</div>`:''}<div style="margin-top:12px"><div class="eyebrow">Salud vehículo</div>${renderHealthSemaphore()}</div><div style="margin-top:12px">${budgetHtml()}</div></div>
    </div>
    <div class="card section"><div class="section-head"><div><div class="eyebrow">Asistente personal</div><h2>Recomendaciones según tu uso</h2></div><button class="secondary" onclick="openMonthlyReport()">Ver reporte completo</button></div>${assistant(x,rec,rem,iss,monthlyData,avgMonthly)}</div>`;
  }
  if(t==='millas'){
    return `<div class="card section"><div class="section-head"><div><div class="eyebrow">Bitácora de uso</div><h2>Historial de millas mensuales</h2></div><div style="display:flex;gap:6px"><button onclick="openMileageModal()">＋ Registrar millas hoy</button><button class="secondary" onclick="openMonthlyReport()">📊 Reporte</button></div></div>
    <div class="chart-wrap" style="margin-bottom:12px"><canvas id="chartMilesFull"></canvas></div>
    ${mileageTable(mLogs,monthlyData)}</div>`;
  }
  if(t==='historial') return `<div class="card section"><div class="section-head"><div><div class="eyebrow">Orden</div><h2>Historial de servicios</h2></div><button onclick="recordForm()">＋ Servicio</button></div>${recordTable(rec)}</div>`;
  if(t==='mantenimiento') return `<div class="card section"><div class="section-head"><div><div class="eyebrow">Preventivo</div><h2>Servicios programados</h2></div><div style="display:flex;gap:6px;flex-wrap:wrap"><button onclick="reminderForm()">＋ Programar</button><button class="secondary" onclick="generateSmartReminders()">🧠 Auto IA</button><button class="secondary" style="background:#1e2833;border-color:#d9b46a;color:#d9b46a" onclick="exportPDFServicios()">📄 PDF para mecánico</button></div></div>${reminderTable(rem)}<div class="notice" style="margin-top:12px">El PDF incluye VIN, odómetro actual, servicios pendientes con millas y fechas estimadas, y tu promedio mensual de ${Math.round(avgMonthly)} mi/mes.</div></div>`;
  if(t==='checklist') return `<div class="card section"><div class="section-head"><div><div class="eyebrow">Inspección 28 puntos</div><h2>Checklist de inspección</h2></div><div style="display:flex;gap:6px;flex-wrap:wrap"><button onclick="openInspectionForm()">＋ Nueva inspección</button><button class="secondary" onclick="exportPDFChecklist()">📄 PDF Checklist</button></div></div>${inspectionTable(db.inspections.filter(i=>i.vehicleId===x.id))}</div>`;

  if(t==='problemas') return `<div class="card section"><div class="section-head"><div><div class="eyebrow">Diagnóstico</div><h2>Problemas y seguimiento</h2></div><button onclick="issueForm()">＋ Problema</button></div>${issueTable(iss)}</div>`;
  if(t==='gastos') return `<div class="grid"><div class="stat"><div class="n">${money(exp.reduce((a,r)=>a+Number(r.amount||0),0)+rec.reduce((a,r)=>a+Number(r.cost||0),0))}</div><div class="l">Total acumulado</div></div><div class="stat"><div class="n">${money(rec.reduce((a,r)=>a+Number(r.cost||0),0))}</div><div class="l">Mantenimiento</div></div><div class="stat"><div class="n">${money(exp.reduce((a,r)=>a+Number(r.amount||0),0))}</div><div class="l">Otros gastos</div></div><div class="stat"><div class="n">${(avgMonthly? ( (exp.reduce((a,r)=>a+Number(r.amount||0),0)+rec.reduce((a,r)=>a+Number(r.cost||0),0)) / Math.max(1, monthlyData.length) ).toFixed(0) : '0')}</div><div class="l">Prom gasto/mes</div></div></div><div class="card section"><div class="section-head"><div><div class="eyebrow">Finanzas</div><h2>Gastos</h2></div><button onclick="expenseForm()">＋ Gasto</button></div>${expenseTable(exp)}</div>`;
  if(t==='viajes') return `<div class="card section"><div class="section-head"><div><div class="eyebrow">Carretera</div><h2>Checklist viajes + Modo viaje</h2></div><div style="display:flex;gap:6px;flex-wrap:wrap"><button onclick="openTravelChecklistForm()">＋ Checklist carretera</button><button class="secondary" onclick="openTravelLogForm()">🛣️ Iniciar viaje</button></div></div>${travelChecklistTable()}<div class="notice" style="margin-top:12px">Checklist carretera: 6 categorías, ${ROAD_TRIP_TEMPLATE.reduce((a,c)=>a+c.items.length,0)} puntos. Marca todo antes de salir. Genera PDF para llevar.</div><div class="card section" style="margin-top:12px"><div class="section-head"><h2>Viajes registrados</h2></div><div class="table"><table><thead><tr><th>Fecha</th><th>Destino</th><th>Odo</th><th>Millas</th><th></th></tr></thead><tbody>${db.travelLogs.filter(l=>l.vehicleId===selected).map(l=>`<tr><td>${esc(l.startDate||'')}</td><td>${esc(l.destination||'')}</td><td>${Number(l.startOdo||0).toLocaleString()} → ${l.endOdo?Number(l.endOdo).toLocaleString():'—'}</td><td>${l.miles?l.miles.toLocaleString()+' mi':'en curso'}</td><td>${l.status==='en_curso'?`<button class="secondary" onclick="closeTravelLog('${l.id}')">Cerrar viaje</button>`:''}</td></tr>`).join('')||'<tr><td colspan=5 class="sub">Sin viajes</td></tr>'}</tbody></table></div></div></div>`;
  if(t==='bitacora') return `<div class="card section"><div class="section-head"><div><div class="eyebrow">Notas rápidas</div><h2>Bitácora</h2></div><div style="display:flex;gap:6px"><button onclick="openNoteForm()">＋ Nota rápida</button><button class="secondary" onclick="openQuickSearch()">🔍 Buscar</button></div></div>${notesTable()}</div>`;
  if(t==='timeline') return `<div class="card section"><div class="section-head"><div><div class="eyebrow">Historial completo</div><h2>Timeline</h2></div><button class="secondary" onclick="exportJSON()">💾 Respaldo</button></div>${timelineHtml()}</div>`;
  if(t==='partes') return `<div class="card section"><div class="section-head"><div><div class="eyebrow">Catálogo Enclave 2013</div><h2>Refacciones compatibles</h2></div><div style="display:flex;gap:6px"><button onclick="openPartForm()">＋ Refacción</button><button class="secondary" onclick="exportPDFServicios()">📄 PDF mecánico</button></div></div>${partsTable()}${budgetHtml()}</div>`;
  if(t==='vin') return `<div class="card section"><div class="eyebrow">VIN</div><h2>VIN y recalls</h2><div class="rows"><div class="row"><span>VIN</span><b style="font-family:var(--mono)">${esc(x.vin||'')}</b></div></div><div style="display:flex;gap:8px;margin-top:12px"><button onclick="decodeVIN()">🔎 Decodificar</button><button class="secondary" onclick="openRecall()">NHTSA recalls</button></div><div id="vinResult" style="margin-top:12px"></div></div><div class="card section" style="margin-top:12px">${renderHealthSemaphore()}</div>`;

  return `<div class="card section"><div class="eyebrow">Ficha</div><h2>Ficha técnica</h2><div class="rows">
    <div class="row"><span>Marca / Modelo</span><b>${esc(x.make)} ${esc(x.model)}</b></div><div class="row"><span>Año</span><b>${x.year}</b></div><div class="row"><span>VIN</span><b style="font-family:var(--mono)">${esc(x.vin||'—')}</b></div>
    <div class="row"><span>Motor</span><b>${esc(x.engine||'—')}</b></div><div class="row"><span>Tracción</span><b>${esc(x.drive||'—')}</b></div><div class="row"><span>Llantas</span><b>${esc(x.tire||'')}</b></div><div class="row"><span>Aceite</span><b>${esc(x.oil||'')} ${esc(x.oilViscosity||'')}</b></div>
  </div><div style="margin-top:12px;display:flex;gap:8px"><button onclick="editVehicle()">✎ Editar</button><button class="secondary" onclick="exportJSON()">💾 Respaldo</button></div></div>`;
}

function reminderCards(a){return `<div class="mini-list">${a.map(r=>{let s=reminderStatus(r);let due=[];if(r.nextMileage)due.push(Number(r.nextMileage).toLocaleString()+' '+(v().unit||''));if(r.nextDate)due.push(r.nextDate);return `<div class="mini" onclick="editReminder('${r.id}')" style="cursor:pointer"><div><b>${esc(r.name)}</b><span>${due.join(' · ')} · ${esc(r.type||'')}</span></div><span class="badge ${s[1]}">${s[0]}</span></div>`}).join('')}</div>`}
function assistant(x,rec,rem,iss,monthlyData,avgMonthly){
  let out=[];
  const due=rem.filter(r=>r.name!=='Actualizar kilometraje mensual'&&reminderStatus(r)[1]!=='ok');
  if(due.length)out.push(`<b>Atención:</b> ${due.length} servicios próximos o vencidos. Revisa pestaña Servicios.`);
  if(avgMonthly>1500)out.push(`<b>Uso alto:</b> ${Math.round(avgMonthly).toLocaleString()} mi/mes es uso intenso. Reduce intervalo de aceite a 5,000 mi.`);
  else if(avgMonthly>0&&avgMonthly<300)out.push(`<b>Uso bajo:</b> ${Math.round(avgMonthly)} mi/mes. Cambia aceite mínimo cada 6 meses aunque no llegues a millas.`);
  const open=iss.filter(i=>i.status!=='resuelto');if(open.length)out.push(`<b>Diagnóstico:</b> ${open.length} problemas abiertos.`);
  if(monthlyData.length>=2){
    const last=monthlyData[monthlyData.length-1],prev=monthlyData[monthlyData.length-2];
    const diff=last.miles-prev.miles;
    if(Math.abs(diff)>300)out.push(`<b>Variación:</b> este mes recorriste ${diff>0?'+':''}${diff} mi vs mes anterior.`);
  }
  if(!out.length)out.push(`<b>Todo en orden:</b> ${Math.round(avgMonthly)} mi/mes promedio. Mantén actualización mensual de millas.`);
  return `<div class="rows">${out.map(s=>`<div class="notice">${s}</div>`).join('')}</div>`;
}

/* Tables */
function recordTable(a){if(!a.length)return `<div class="empty">Sin registros<br><button onclick="recordForm()">Registrar primer servicio</button></div>`;a=[...a].sort((x,y)=>y.date.localeCompare(x.date));return `<div class="table"><table><thead><tr><th>Fecha</th><th>Trabajo</th><th>Cat</th><th>Costo</th><th></th></tr></thead><tbody>${a.map(r=>`<tr><td>${esc(r.date)}<br><small>${Number(r.odo).toLocaleString()}</small></td><td><b>${esc(r.service)}</b><br><span class="sub">${esc(r.shop||'')}${r.notes?' · '+esc(r.notes.slice(0,50)):''}</span></td><td>${esc(r.category||'')}</td><td>${money(r.cost)}</td><td><div style="display:flex;gap:4px"><button class="secondary" onclick="editRecord('${r.id}')">✎</button><button class="danger" style="border:0;background:var(--badBg);color:#ffb4b8;padding:6px 8px;border-radius:8px" onclick="delRecord('${r.id}')">×</button></div></td></tr>`).join('')}</tbody></table></div>`}
function mileageTable(logs,monthly){
  if(!logs.length)return `<div class="empty">Sin registros de millas. Usa ＋ Millas para empezar.</div>`;
  logs=[...logs].sort((a,b)=>b.date.localeCompare(a.date));
  return `<div class="table"><table><thead><tr><th>Fecha</th><th>Odo</th><th>Recorrido</th><th>Notas</th><th></th></tr></thead><tbody>${logs.map((l,i)=>{
    const next=logs[i-1]; // because sorted desc
    const prev=logs[i+1];
    // Actually monthly array has calculated miles, match by date
    const m=monthly.find(mm=>mm.to===l.date||mm.from===l.date);
    const milesFromPrev=prev? l.odo-prev.odo : 0;
    return `<tr><td>${esc(l.date)}</td><td><b>${Number(l.odo).toLocaleString()}</b> ${esc(v().unit||'mi')}</td><td>${i===logs.length-1?'Inicio':'+'+milesFromPrev.toLocaleString()+' '+(v().unit||'mi')}${m?`<br><small class="sub">${m.days} días · ${m.avgPerDay.toFixed(1)}/día</small>`:''}</td><td><span class="sub">${esc(l.notes||'')}</span></td><td><div style="display:flex;gap:4px"><button class="secondary" onclick="editMileage('${l.id}')">✎</button><button class="danger" style="border:0;background:var(--badBg);color:#ffb4b8;padding:6px 8px;border-radius:8px" onclick="delMileage('${l.id}')">×</button></div></td></tr>`
  }).join('')}</tbody></table></div>`;
}
function reminderTable(a){if(!a.length)return `<div class="empty">Sin recordatorios</div>`;return `<div class="table"><table><thead><tr><th>Servicio</th><th>Próximo</th><th>Intervalo</th><th>Estado</th><th></th></tr></thead><tbody>${a.map(r=>{let s=reminderStatus(r);return `<tr><td><b>${esc(r.name)}</b><br><span class="sub">${esc(r.notes||'')}</span></td><td>${r.nextMileage?Number(r.nextMileage).toLocaleString():''} ${r.nextDate||''}</td><td>${(r.intervalMiles||'')+' '+(r.intervalMonths?r.intervalMonths+' meses':'')}</td><td><span class="badge ${s[1]}">${s[0]}</span></td><td><div style="display:flex;gap:4px;flex-wrap:wrap"><button class="secondary" onclick="completeReminder('${r.id}')">✓</button><button class="secondary" onclick="editReminder('${r.id}')">✎</button><button class="danger" style="border:0;background:var(--badBg);color:#ffb4b8;padding:6px 8px;border-radius:8px" onclick="delReminder('${r.id}')">×</button></div></td></tr>`}).join('')}</tbody></table></div>`}
function issueTable(a){if(!a.length)return `<div class="empty">Sin diagnósticos</div>`;return `<div class="table"><table><thead><tr><th>Fecha</th><th>Problema</th><th>Costo</th><th>Estado</th><th></th></tr></thead><tbody>${a.map(r=>`<tr><td>${esc(r.date)}</td><td><b>${esc(r.title)}</b><br><span class="sub">${esc(r.description||'').slice(0,70)}</span></td><td>${money(r.cost||0)}</td><td><span class="badge ${r.status==='resuelto'?'ok':r.status==='en observación'?'warn':'bad'}">${esc(r.status)}</span></td><td><div style="display:flex;gap:4px"><button class="secondary" onclick="editIssue('${r.id}')">✎</button><button class="danger" style="border:0;background:var(--badBg);color:#ffb4b8;padding:6px 8px;border-radius:8px" onclick="delIssue('${r.id}')">×</button></div></td></tr>`).join('')}</tbody></table></div>`}
function expenseTable(a){if(!a.length)return `<div class="empty">Sin gastos</div>`;a=[...a].sort((x,y)=>y.date.localeCompare(x.date));return `<div class="table"><table><thead><tr><th>Fecha</th><th>Concepto</th><th>Monto</th><th></th></tr></thead><tbody>${a.map(r=>`<tr><td>${esc(r.date)}</td><td><b>${esc(r.description)}</b><br><span class="sub">${esc(r.category||'')}</span></td><td>${money(r.amount)}</td><td><div style="display:flex;gap:4px"><button class="secondary" onclick="expenseForm(db.expenses.find(x=>x.id==='${r.id}'))">✎</button><button class="danger" style="border:0;background:var(--badBg);color:#ffb4b8;padding:6px 8px;border-radius:8px" onclick="delExpense('${r.id}')">×</button></div></td></tr>`).join('')}</tbody></table></div>`}

/* Charts */
let chartInstances={};
function drawCharts(mLogs,monthlyData,exp,rec){
  try{
    const ctx=document.getElementById('chartMiles');if(ctx){
      if(chartInstances.miles)chartInstances.miles.destroy();
      const labels=monthlyData.map(m=>m.to.slice(5));const data=monthlyData.map(m=>m.miles);
      chartInstances.miles=new Chart(ctx,{type:'bar',data:{labels,datasets:[{label:'Millas por mes',data,backgroundColor:'#d9b46a',borderRadius:8}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{color:'#9aa6b5',font:{size:10}}},y:{grid:{color:'#1f2a36'},ticks:{color:'#9aa6b5'}}}}});
    }
    const ctxFull=document.getElementById('chartMilesFull');if(ctxFull){
      if(chartInstances.milesFull)chartInstances.milesFull.destroy();
      const labels=monthlyData.map(m=>m.to);const data=monthlyData.map(m=>m.miles);const avgLine=monthlyData.map(()=>monthlyData.reduce((a,b)=>a+b.miles,0)/Math.max(monthlyData.length,1));
      chartInstances.milesFull=new Chart(ctxFull,{type:'line',data:{labels,datasets:[{label:'Millas',data,borderColor:'#d9b46a',backgroundColor:'rgba(217,180,106,.15)',fill:true,tension:.3},{label:'Promedio',data:avgLine,borderColor:'#7aa8ff',borderDash:[6,4],tension:.3,pointRadius:0}]},options:{responsive:true,plugins:{legend:{labels:{color:'#9aa6b5'}}},scales:{x:{ticks:{color:'#6b7888'}},y:{grid:{color:'#1f2a36'},ticks:{color:'#9aa6b5'}}}}});
    }
  }catch(e){console.warn(e)}
}

/* Modals */
function modal(html){document.getElementById('modalRoot').innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;setTimeout(()=>{document.querySelector('.modal input')?.focus()},40)}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}

function vehicleForm(data={}){
  const edit=!!data.id;
  modal(`<h2>${edit?'Editar':'Agregar'} vehículo</h2><form onsubmit="saveVehicle(event,${edit})"><div class="formgrid">
    <label>Marca<input name="make" required value="${esc(data.make||'')}"></label><label>Modelo<input name="model" required value="${esc(data.model||'')}"></label>
    <label>Año<input name="year" type="number" value="${esc(data.year||'')}" required></label><label>VIN<input name="vin" maxlength="17" value="${esc(data.vin||'')}" style="font-family:var(--mono)"></label>
    <label>Motor<input name="engine" value="${esc(data.engine||'')}"></label><label>Tracción<input name="drive" value="${esc(data.drive||'')}"></label>
    <label>Odómetro actual<input name="odo" type="number" value="${esc(data.odo||0)}" required></label><label>Unidad<select name="unit"><option ${data.unit==='km'?'selected':''}>km</option><option ${data.unit!=='km'?'selected':''}>mi</option></select></label>
    <label>Llantas<input name="tire" value="${esc(data.tire||'')}"></label><label>Presión PSI<input name="tirePressure" value="${esc(data.tirePressure||'')}"></label>
    <label>Aceite<input name="oil" value="${esc(data.oil||'')}"></label><label>Viscosidad<input name="oilViscosity" value="${esc(data.oilViscosity||'')}"></label>
    <label>Filtro<input name="oilFilter" value="${esc(data.oilFilter||'')}"></label><label>Bujías<input name="spark" value="${esc(data.spark||'')}"></label>
    <label class="full">Notas<textarea name="notes">${esc(data.notes||'')}</textarea></label>
  </div><div style="margin-top:14px;display:flex;gap:8px"><button>Guardar</button><button type="button" class="secondary" onclick="closeModal()">Cancelar</button>${edit?`<button type="button" class="danger" style="border:0;background:var(--badBg);color:#ffb4b8;padding:11px 16px;border-radius:12px" onclick="deleteVehicle('${data.id}')">Eliminar</button>`:''}</div></form>`);
}
function addVehicle(){vehicleForm()}function editVehicle(){vehicleForm(v())}
function saveVehicle(e,edit){e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.year=+o.year||2020;o.odo=+o.odo||0;o.vin=(o.vin||'').toUpperCase();if(edit){Object.assign(v(),o)}else{o.id='v-'+Date.now();db.vehicles.push(o);selected=o.id}closeModal();save();toast(edit?'Vehículo actualizado':'Vehículo agregado','ok')}
function deleteVehicle(id){if(db.vehicles.length<2){toast('Mínimo 1 vehículo','warn');return}if(confirm('¿Eliminar vehículo y todo su historial?')){db.vehicles=db.vehicles.filter(x=>x.id!==id);db.records=db.records.filter(x=>x.vehicleId!==id);db.reminders=db.reminders.filter(x=>x.vehicleId!==id);db.issues=db.issues.filter(x=>x.vehicleId!==id);db.expenses=db.expenses.filter(x=>x.vehicleId!==id);db.mileageLogs=db.mileageLogs.filter(x=>x.vehicleId!==id);db.inspections=db.inspections.filter(x=>x.vehicleId!==id);selected=db.vehicles[0]?.id||null;closeModal();save();toast('Eliminado','bad')}}

function openMileageModal(data={}){
  const edit=!!data.id;
  const lastOdo=v()?.odo||0;
  modal(`<h2>${edit?'Editar':'Registrar'} millas recorridas</h2>
    <div class="notice" style="margin-bottom:12px">Registra tu kilometraje actual cada mes. Así calculamos millas por mes, promedio y cuándo te toca el próximo servicio.</div>
    <form onsubmit="saveMileage(event,'${data.id||''}')">
    <div class="formgrid">
      <label>Fecha<input name="date" type="date" required value="${esc(data.date||today())}"></label>
      <label>Odómetro actual<input name="odo" type="number" required value="${esc(data.odo??lastOdo)}" min="0"></label>
      <label class="full">Notas (opcional)<input name="notes" value="${esc(data.notes||'')}" placeholder="Ej. Fin de mes, viaje a Tijuana, etc."></label>
      <div class="full notice" id="mileageCalc" style="display:none"></div>
    </div>
    <div style="margin-top:12px;display:flex;gap:8px"><button>Guardar millas</button><button type="button" class="secondary" onclick="closeModal()">Cancelar</button></div>
    </form>
    <div class="sub" style="margin-top:10px">Últimos registros: ${(db.mileageLogs.filter(l=>l.vehicleId===selected).slice(-3).map(l=>`${l.date}: ${Number(l.odo).toLocaleString()}`).join(' · ')||'—')}</div>
  `);
  const odoInput=document.querySelector('input[name="odo"]');const dateInput=document.querySelector('input[name="date"]');
  function calc(){

  {kw:['filtro de aire','air filter'],name:'Cambio filtro de aire motor',miles:15000,months:12},

  {kw:['frenos','pastilla','balata','rotor'],name:'Inspección de frenos',miles:15000,months:12},

function autoCreateReminderFromService(record){
  const txt=(record.service+' '+record.category).toLowerCase();
  for(const m of SERVICE_MAP){if(m.kw.some(k=>txt.includes(k))){const exists=db.reminders.some(r=>r.vehicleId===record.vehicleId&&r.name.toLowerCase().includes(m.name.toLowerCase().split(' ')[0])&&r.id!=='m-monthly');if(!exists){const nextMiles=Number(v().odo||record.odo)+m.miles;const d=new Date();d.setMonth(d.getMonth()+m.months);db.reminders.push({id:'m-'+Date.now()+Math.random().toString(16).slice(2),vehicleId:record.vehicleId,name:m.name,nextMileage:nextMiles,nextDate:d.toISOString().slice(0,10),warnMiles:800,warnDays:30,type:'Reemplazo',source:'E.O. IA',intervalMiles:m.miles,intervalMonths:m.months,status:'pending',notes:`Auto tras: ${record.service}`});toast(`🧠 Recordatorio creado: ${m.name}`,'ok');}break;}}
}

function saveInspection(e,editId){
  e.preventDefault();
  const fd=new FormData(e.target);
  const o={date:fd.get('date')||today(),odo:+(fd.get('odo')||0),notes:fd.get('notes')||'',vehicleId:selected};
  const items=[];
  INSPECTION_TEMPLATE.forEach((group,gIdx)=>{
    group.items.forEach((itemName,iIdx)=>{
      const key=`${gIdx}-${iIdx}`;
      const status=document.getElementById(`ins-${key}-status`)?.value||'pendiente';
      const notes=document.getElementById(`ins-${key}-notes`)?.value||'';
      items.push({cat:group.cat,name:itemName,status,notes});
    });
  });
  o.items=items;
  const atencion=items.filter(it=>it.status==='atencion').length;
  const ok=items.filter(it=>it.status==='ok').length;
  o.overallStatus= atencion>0 ? `atencion (${atencion} puntos)` : `ok (${ok}/${items.length})`;
  if(editId){Object.assign(db.inspections.find(x=>x.id===editId),o)}else{o.id='insp-'+Date.now();db.inspections.push(o);if(o.odo>v().odo)v().odo=o.odo}
  closeModal();save();toast(`Inspección guardada: ${o.overallStatus}`,'ok');
}

/* PDF Exports */
function exportPDFServicios(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const x=v();
  const rem=db.reminders.filter(r=>r.vehicleId===x.id);
  const pending=rem.filter(r=>reminderStatus(r)[1]!=='ok');
  const monthly=getMonthlyMiles(x.id);
  const avg=getAvgMonthlyMiles(x.id);
  
  // Header
  doc.setFillColor(8,10,13);doc.rect(0,0,210,22,'F');
  doc.setTextColor(217,180,106);doc.setFontSize(14);doc.setFont('helvetica','bold');doc.text('E.O. Garage - Servicios Pendientes',14,14);
  doc.setTextColor(255,255,255);doc.setFontSize(9);doc.text(`Build 15.0 Super Pro Personal - ${today()}`,150,14);
  
  // Vehicle info
  doc.setTextColor(0,0,0);doc.setFontSize(11);doc.setFont('helvetica','bold');doc.text(`${x.make} ${x.model} ${x.year}`,14,32);
  doc.setFontSize(9);doc.setFont('helvetica','normal');
  doc.text(`VIN: ${x.vin||'—'}`,14,38);
  doc.text(`Motor: ${x.engine||'—'} | ${x.drive||''} | ${x.tire||''}`,14,43);
  doc.text(`Odo actual: ${Number(x.odo).toLocaleString()} ${x.unit||'mi'} | Promedio: ${Math.round(avg).toLocaleString()} mi/mes`,14,48);
  doc.text(`Fecha reporte: ${today()} | Total millas registradas: ${monthly.reduce((a,b)=>a+b.miles,0).toLocaleString()} mi`,14,53);
  
  // Pending services
  doc.setFontSize(12);doc.setFont('helvetica','bold');doc.text('Servicios que requiere la camioneta:',14,64);
  let y=72;
  if(!pending.length){
    doc.setFontSize(10);doc.setFont('helvetica','normal');doc.text('✓ No hay servicios pendientes. Todo al día.',14,y);
    y+=8;
  } else {
    doc.setFontSize(9);doc.setFont('helvetica','bold');
    doc.text('Servicio',14,y);doc.text('Próximo',90,y);doc.text('Estado',130,y);doc.text('Notas',155,y);
    y+=4;doc.line(14,y,196,y);y+=5;
    doc.setFont('helvetica','normal');
    pending.forEach(r=>{
      if(y>270){doc.addPage();y=20;}
      const status=reminderStatus(r)[0];
      const next=r.nextMileage? Number(r.nextMileage).toLocaleString()+' '+(x.unit||'mi') : (r.nextDate||'—');
      const interval=(r.intervalMiles? r.intervalMiles+' mi' : '') + (r.intervalMonths? ' / '+r.intervalMonths+' meses' : '');
      doc.text(r.name.substring(0,40),14,y);
      doc.text(next,90,y);
      doc.text(status,130,y);
      doc.text((r.notes||interval||'').substring(0,30),155,y);
      y+=6;
      // Estimated date
      if(r.nextMileage&&avg){
        const remaining=r.nextMileage - x.odo;
        if(remaining>0){
          const months=remaining/avg;
          const estDate=new Date();estDate.setMonth(estDate.getMonth()+months);
          doc.setFontSize(7);doc.setTextColor(100,100,100);
          doc.text(`Estimado: ${estDate.toLocaleDateString('es-MX')} (en ${months.toFixed(1)} meses)`,14,y);
          doc.setFontSize(9);doc.setTextColor(0,0,0);
          y+=4;
        }
      }
    });
  }
  
  // Monthly summary
  y+=6;if(y>250){doc.addPage();y=20;}
  doc.setFontSize(11);doc.setFont('helvetica','bold');doc.text('Resumen de uso mensual:',14,y);y+=8;
  doc.setFontSize(8);doc.setFont('helvetica','normal');
  monthly.slice(-6).reverse().forEach(m=>{
    if(y>280){doc.addPage();y=20;}
    doc.text(`${m.from} → ${m.to}: ${m.miles.toLocaleString()} mi en ${m.days} días (prom ${m.avgPerDay.toFixed(1)}/día)`,14,y);
    y+=5;
  });
  
  // Footer
  doc.setFontSize(8);doc.setTextColor(100,100,100);
  doc.text(`E.O. Garage v15 Super Pro Final | ${x.make} ${x.model} | Generado ${new Date().toLocaleString('es-MX')} | Para mecánico`,14,290);
  
  doc.save(`Servicios_${x.make}_${x.model}_${today()}.pdf`);
  toast('PDF de servicios generado para mecánico','ok');
}

/* Super Pro - Health Semaphore */
function getHealthByCategory(vehicleId){
  const ins=[...db.inspections.filter(i=>i.vehicleId===vehicleId)].sort((a,b)=>b.date.localeCompare(a.date))[0];
  if(!ins||!ins.items.length) return null;
  const byCat={};
  ins.items.forEach(it=>{
    if(!byCat[it.cat]) byCat[it.cat]={total:0,ok:0,atencion:0};
    byCat[it.cat].total++;
    if(it.status==='ok') byCat[it.cat].ok++;
    if(it.status==='atencion') byCat[it.cat].atencion++;
  });
  Object.keys(byCat).forEach(c=>{
    const d=byCat[c];
    d.pct = d.total? Math.round((d.ok/d.total)*100) : 0;
    d.status = d.atencion>0 ? (d.pct<60?'bad':'warn') : 'ok';
  });
  return byCat;
}
function renderHealthSemaphore(){
  const health=getHealthByCategory(selected);
  if(!health) return '<div class="notice">Haz una inspección para ver salud por categoría</div>';
  return '<div class="grid" style="grid-template-columns:repeat(3,1fr)">'+Object.entries(health).map(([cat,data])=>`
    <div class="stat" style="border-color:${data.status==='ok'?'#1e4a32':data.status==='warn'?'#4a3f1e':'#5a2a2d'}">
      <div style="display:flex;justify-content:space-between"><span style="font-size:11px;font-weight:800">${cat}</span><span class="badge ${data.status}">${data.pct}%</span></div>
      <div style="margin-top:6px;height:6px;background:#1f2730;border-radius:999px;overflow:hidden"><div style="width:${data.pct}%;height:100%;background:${data.status==='ok'?'var(--ok)':data.status==='warn'?'var(--warn)':'var(--bad)'}"></div></div>
      <div class="sub" style="margin-top:4px">${data.ok}/${data.total} OK · ${data.atencion} atención</div>
    </div>`).join('')+'</div>';
}

/* Quick Search CMD+K */
function openQuickSearch(){
  modal(`<h2>🔍 Búsqueda rápida (CMD+K)</h2><input id="qSearch" placeholder="Busca aceite, frenos, 169000, Tijuana..." style="width:100%;padding:12px;border-radius:12px;background:#0e1318;border:1px solid var(--line);color:#fff;margin-top:8px"><div id="qResults" style="margin-top:12px;display:grid;gap:6px;max-height:50vh;overflow:auto"></div><div class="sub" style="margin-top:8px">Tip: Presiona Ctrl+K o Cmd+K en cualquier momento</div>`);
  const inp=document.getElementById('qSearch');inp.focus();
  inp.addEventListener('input',()=>{
    const q=inp.value.toLowerCase();if(q.length<2){document.getElementById('qResults').innerHTML='';return;}
    const results=[];
    db.records.filter(r=>r.vehicleId===selected).forEach(r=>{if((r.service+' '+r.category+' '+r.notes).toLowerCase().includes(q)) results.push(`🛠️ ${r.date} - ${r.service} - ${money(r.cost)}`);});
    db.mileageLogs.filter(r=>r.vehicleId===selected).forEach(r=>{if((r.notes||'').toLowerCase().includes(q)||String(r.odo).includes(q)) results.push(`🛣️ ${r.date} - ${r.odo} mi - ${r.notes||''}`);});
    db.partsCatalog.filter(r=>r.vehicleId===selected).forEach(r=>{if((r.name+' '+r.partNumber).toLowerCase().includes(q)) results.push(`🔧 ${r.name} - ${r.partNumber} - ${money(r.lastPrice)}`);});
    db.travelChecklists.filter(r=>r.vehicleId===selected).forEach(r=>{if((r.destination+' '+r.notes).toLowerCase().includes(q)) results.push(`🚗 Viaje ${r.date} - ${r.destination}`);});
    document.getElementById('qResults').innerHTML=results.slice(0,20).map(r=>`<div class="mini">${esc(r)}</div>`).join('')||'<div class="sub">Sin resultados</div>';
  });
}
document.addEventListener('keydown',(e)=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openQuickSearch();}});

/* Export v2 PDF improved */
function exportPDFServiciosV2(){
  // Use existing exportPDFServicios but add health, parts, timeline
  exportPDFServicios();
  setTimeout(()=>{
    // After first PDF, also generate detailed
    const { jsPDF } = window.jspdf;const doc=new jsPDF();const x=v();const health=getHealthByCategory(selected);
    doc.text('Salud vehículo por categoría:',14,20);
    let y=30;if(health) Object.entries(health).forEach(([cat,data])=>{doc.text(`${cat}: ${data.pct}% OK - ${data.ok}/${data.total}`,14,y);y+=6;});
    doc.save(`Salud_${x.make}_${today()}.pdf`);
  },500);
}

/* Backup */
function exportJSON(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`EO_Garage_Personal_${today()}.json`;a.click();toast('Respaldo descargado','ok')}
function restore(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.vehicles)throw 0;d.mileageLogs=d.mileageLogs||[];db=normalize(d);selected=db.vehicles[0]?.id||null;save();toast('Respaldo restaurado','ok')}catch(e){toast('Archivo no válido','bad')}};r.readAsText(f)};i.click()}
function decodeVIN(){const el=document.getElementById('vinResult');const cur=v();if(!cur?.vin||cur.vin.length!==17){el.innerHTML='<div class="notice">VIN 17 caracteres</div>';return}el.innerHTML='<div class="notice">Consultando…</div>';fetch('https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/'+encodeURIComponent(cur.vin)+'?format=json').then(r=>r.json()).then(j=>{const x=j.Results?.[0];const f=[['Marca',x.Make],['Modelo',x.Model],['Año',x.ModelYear],['Motor',x.EngineModel||x.DisplacementCC+' cc'],['Tracción',x.DriveType]];el.innerHTML='<div class="card section" style="padding:10px">'+f.map(a=>`<div class="row"><span>${esc(a[0])}</span><b>${esc(a[1]||'—')}</b></div>`).join('')+'</div>'}).catch(e=>{el.innerHTML='<div class="notice bad">Error: '+esc(e.message)+'</div>'})}
function openRecall(){window.open('https://www.nhtsa.gov/recalls?vin='+encodeURIComponent(v()?.vin||''),'_blank')}

function uuid(id){return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(id||''))?id:crypto.randomUUID()}
async function syncTable(table,rows,mapFn){const existing=await sb.from(table).select('id').eq('owner_id',cloudUser.id);if(existing.error)throw existing.error;const keep=new Set();const payload=rows.map(r=>{const id=uuid(r.id);r.id=id;keep.add(id);return mapFn(r,id)});if(payload.length){const {error}=await sb.from(table).upsert(payload,{onConflict:'id'});if(error)throw error}for(const row of existing.data||[]){if(!keep.has(row.id)){await sb.from(table).delete().eq('owner_id',cloudUser.id).eq('id',row.id)}}}
async function cloudSave(force=false){
  if(!cloudUser||(!cloudReady&&!force))return;if(cloudSyncing){saveQueue=true;return}cloudSyncing=true;
  try{
    setCloudStatus('☁️ Guardando…');
    const idMap=new Map();for(const r of db.vehicles){const old=r.id;const id=uuid(old);if(old!==id)idMap.set(old,id);r.id=id}
    if(idMap.size){const remap=arr=>arr.forEach(r=>{if(idMap.has(r.vehicleId))r.vehicleId=idMap.get(r.vehicleId)});remap(db.records);remap(db.reminders);remap(db.issues);remap(db.expenses);remap(db.mileageLogs)}
    await syncTable('eo_garage_vehicles',db.vehicles,(r,id)=>({id,owner_id:cloudUser.id,make:r.make,model:r.model,model_year:Number(r.year)||null,vin:r.vin||null,engine:r.engine||null,drivetrain:r.drive||null,current_mileage:Number(r.odo)||0,tire_size:r.tire||null,tire_pressure_psi:r.tirePressure?Number(r.tirePressure):null,oil_brand:r.oil||null,oil_viscosity:r.oilViscosity||null,oil_filter_brand:r.oilFilter||null,spark_plug_brand:r.spark||null,notes:r.notes||null,service_notes:r.serviceNotes||null}));
    await syncTable('eo_garage_maintenance',db.records,(r,id)=>({id,owner_id:cloudUser.id,vehicle_id:r.vehicleId,service_date:r.date||today(),mileage:Number(r.odo)||null,category:r.category||'Mantenimiento',description:r.service||'Trabajo',brand:r.parts||null,part_number:r.partNumber||null,cost:Number(r.cost)||0,shop:r.shop||null,notes:r.notes||null}));
    await syncTable('eo_garage_reminders',db.reminders,(r,id)=>({id,owner_id:cloudUser.id,vehicle_id:r.vehicleId,title:r.name||'Servicio',category:r.type||null,interval_miles:r.intervalMiles?Number(r.intervalMiles):null,interval_months:r.intervalMonths?Number(r.intervalMonths):null,due_mileage:r.nextMileage?Number(r.nextMileage):null,due_date:r.nextDate||null,status:r.status||'pending',notes:r.notes||null}));
    await syncTable('eo_garage_issues',db.issues,(r,id)=>({id,owner_id:cloudUser.id,vehicle_id:r.vehicleId,title:r.title||'Problema',description:r.description||null,priority:r.severity||'normal',status:r.status==='resuelto'?'resuelto':(r.status==='en observación'?'en observación':'abierto'),diagnosed_at:r.date||null,notes:r.notes||null,cost:Number(r.cost)||0}));
    await syncTable('eo_garage_expenses',db.expenses,(r,id)=>({id,owner_id:cloudUser.id,vehicle_id:r.vehicleId,expense_date:r.date||today(),mileage:Number(r.odo)||null,category:r.category||'Otro',description:r.description||'Gasto',amount:Number(r.amount)||0,notes:r.notes||null}));
    try{await syncTable('eo_garage_mileage_logs',db.mileageLogs,(r,id)=>({id,owner_id:cloudUser.id,vehicle_id:r.vehicleId,log_date:r.date||today(),mileage:Number(r.odo)||0,notes:r.notes||null}));}catch(e){console.warn('mileage table missing',e.message)}
    try{await syncTable('eo_garage_inspections',db.inspections,(r,id)=>({id,owner_id:cloudUser.id,vehicle_id:r.vehicleId,inspection_date:r.date||today(),mileage:Number(r.odo)||0,items:JSON.stringify(r.items||[]),notes:r.notes||null,overall_status:r.overallStatus||'pendiente'}));}catch(e){console.warn('inspections table missing',e.message)}
    localStorage.setItem(KEY,JSON.stringify(db));setCloudStatus('☁️ Nube conectada');
  }catch(e){console.error(e);setCloudStatus('⚠️ Local');toast('Error nube','bad')}finally{cloudSyncing=false;if(saveQueue){saveQueue=false;setTimeout(()=>cloudSave(true),500)}}
}
async function loadCloudToLocal(){
  const qv=await sb.from('eo_garage_vehicles').select('*').order('created_at',{ascending:true});if(qv.error)throw qv.error;if(!qv.data.length){await cloudSave(true);cloudReady=true;return}
  const vehicles=qv.data.map(x=>({id:x.id,make:x.make,model:x.model,year:x.model_year,vin:x.vin||'',engine:x.engine||'',drive:x.drivetrain||'',odo:x.current_mileage||0,unit:'mi',fuel:'Gasolina',tire:x.tire_size||'',tirePressure:x.tire_pressure_psi||'',oil:x.oil_brand||'',oilViscosity:x.oil_viscosity||'',oilFilter:x.oil_filter_brand||'',spark:x.spark_plug_brand||'',notes:x.notes||'',serviceNotes:x.service_notes||''}));
  const ids=vehicles.map(x=>x.id);
  const [qm,qr,qi,qe,qml,qin]=await Promise.all([
    sb.from('eo_garage_maintenance').select('*').in('vehicle_id',ids).order('service_date',{ascending:false}),
    sb.from('eo_garage_reminders').select('*').in('vehicle_id',ids),
    sb.from('eo_garage_issues').select('*').in('vehicle_id',ids),
    sb.from('eo_garage_expenses').select('*').in('vehicle_id',ids).order('expense_date',{ascending:false}),
    sb.from('eo_garage_mileage_logs').select('*').in('vehicle_id',ids).order('log_date',{ascending:true}).then(r=>r).catch(()=>({data:[],error:null})),
    sb.from('eo_garage_inspections').select('*').in('vehicle_id',ids).order('inspection_date',{ascending:false}).then(r=>r).catch(()=>({data:[],error:null}))
  ]);
  db.vehicles=vehicles;
  db.records=(qm.data||[]).map(x=>({id:x.id,vehicleId:x.vehicle_id,date:x.service_date,odo:x.mileage||0,category:x.category||'',service:x.description||'',parts:x.brand||'',partNumber:x.part_number||'',cost:Number(x.cost)||0,shop:x.shop||'',notes:x.notes||''}));
  db.reminders=(qr.data||[]).map(x=>({id:x.id,vehicleId:x.vehicle_id,name:x.title,nextMileage:x.due_mileage,nextDate:x.due_date,warnMiles:1000,warnDays:30,type:x.category||'Reemplazo',source:'Supabase',intervalMiles:x.interval_miles||null,intervalMonths:x.interval_months||null,status:x.status||'pending',notes:x.notes||''}));
  db.issues=(qi.data||[]).map(x=>({id:x.id,vehicleId:x.vehicle_id,date:x.diagnosed_at||today(),odo:0,title:x.title,severity:x.priority||'normal',status:(x.status==='resolved'||x.status==='resuelto')?'resuelto':(x.status==='in_progress'||x.status==='en observación'?'en observación':'abierto'),description:x.description||'',notes:x.notes||'',cost:Number(x.cost)||0}));
  db.expenses=(qe.data||[]).map(x=>({id:x.id,vehicleId:x.vehicle_id,date:x.expense_date,odo:x.mileage||0,category:x.category||'Otro',description:x.description||'',amount:Number(x.amount)||0,notes:x.notes||''}));
  db.mileageLogs=(qml.data||[]).map(x=>({id:x.id,vehicleId:x.vehicle_id,date:x.log_date||today(),odo:x.mileage||0,notes:x.notes||''}));
  db.inspections=(qin.data||[]).map(x=>{try{const items=JSON.parse(x.items||'[]');return {id:x.id,vehicleId:x.vehicle_id,date:x.inspection_date||today(),odo:x.mileage||0,items,notes:x.notes||'',overallStatus:x.overall_status||'pendiente'}}catch{return {id:x.id,vehicleId:x.vehicle_id,date:x.inspection_date||today(),odo:x.mileage||0,items:[],notes:x.notes||'',overallStatus:'pendiente'}}});
  selected=db.vehicles[0]?.id||null;localStorage.setItem(KEY,JSON.stringify(db));render();
}
async function syncCloud(){if(!cloudUser||cloudSyncing)return;cloudSyncing=true;try{setCloudStatus('☁️ Sincronizando…');await loadCloudToLocal();cloudReady=true;setCloudStatus('☁️ Nube conectada');toast('Nube sincronizada','ok')}catch(e){setCloudStatus('⚠️ Error nube');toast('Error: '+(e.message||e),'bad')}finally{cloudSyncing=false}}
