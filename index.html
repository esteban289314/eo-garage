function reminderStatus(r){ var x=v(); if(!x) return ['—','ok']; if(r.nextMileage && x.odo>=r.nextMileage) return ['Vencido','bad']; if(r.nextMileage && x.odo>=r.nextMileage-(r.warnMiles||1000)) return ['Próximo','warn']; if(r.nextDate){ var days=(new Date(r.nextDate)-new Date())/86400000; if(days<0) return ['Vencido','bad']; if(days<(r.warnDays||30)) return ['Próximo','warn']; } return ['OK','ok']; }
function getMonthlyMiles(){ var logs=db.mileageLogs.filter(function(l){ return l.vehicleId===selected; }).sort(function(a,b){ return a.date.localeCompare(b.date); }); if(logs.length<2) return [{from:logs[0]?.date||today(),to:today(),miles:0,prevOdo:logs[0]?.odo||0,currOdo:logs[0]?.odo||0,days:1,avgPerDay:0,current:true}]; var m=[]; for(var i=1;i<logs.length;i++){ var prev=logs[i-1],curr=logs[i]; var days=Math.max(1,Math.round((new Date(curr.date)-new Date(prev.date))/86400000)); m.push({from:prev.date,to:curr.date,miles:curr.odo-prev.odo,prevOdo:prev.odo,currOdo:curr.odo,days:days,avgPerDay:(curr.odo-prev.odo)/days,current:i===logs.length-1}); } return m; }
function getAvgMonthlyMiles(){ var m=getMonthlyMiles(); if(!m.length) return 0; var last3=m.slice(-3); return Math.round(last3.reduce(function(a,b){ return a+b.miles; },0)/last3.length); }
function calculateHealthReal(){
  var sections={};
  db.masterRepairs.forEach(function(item){
    if(!sections[item.section]) sections[item.section]={total:0,done:0,pending:[],doneList:[],icon:item.icon};
    sections[item.section].total++; if(item.done){ sections[item.section].done++; sections[item.section].doneList.push(item); } else { sections[item.section].pending.push(item); }
  });
  var result=[]; Object.keys(sections).forEach(function(sec){
    var s=sections[sec]; var pct=s.total?Math.round(s.done/s.total*100):0;
    var color=pct<50?'var(--bad)':pct<80?'var(--warn)':'var(--ok)'; var status=pct<50?'CRITICO':pct<80?'ATENCION':'OK';
    result.push({section:sec,icon:s.icon,total:s.total,done:s.done,pending:s.pending,doneList:s.doneList,pct:pct,color:color,status:status});
  });
  var overall=result.length?Math.round(result.reduce(function(a,b){ return a+b.pct; },0)/result.length):0;
  return {sections:result,overall:overall};
}

function requestNotificationPermission(){
  if(!('Notification' in window)){ toast('Notificaciones no soportadas','warn'); return; }
  if(Notification.permission==='granted'){ toast('🔔 Notificaciones activadas','ok'); localStorage.setItem('eo_notif','granted'); checkAndNotifyReminders(); return; }
  if(Notification.permission!=='denied'){
    Notification.requestPermission().then(function(perm){
      if(perm==='granted'){ toast('🔔 Activadas - Te avisaré de servicios','ok'); localStorage.setItem('eo_notif','granted'); checkAndNotifyReminders(); }
      else { toast('Notificaciones bloqueadas','warn'); }
    });
  } else {
    toast('Activa notificaciones en ajustes del navegador','warn');
  }
}
function showPushNotification(title, body){
  try{
    if(Notification.permission==='granted'){
      new Notification(title, {body:body, icon:'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>'});
    }
  }catch(e){ console.log('Push error', e); }
  toast(title+' - '+body, body.includes('Vencido')?'bad':'warn');
}
function checkAndNotifyReminders(){
  try{
    var x=v(); if(!x) return;
    var rem=db.reminders.filter(function(r){ return r.vehicleId===selected; });
    var notified=JSON.parse(localStorage.getItem('eo_notified')||'[]');
    rem.forEach(function(r){
      var s=reminderStatus(r);
      var key=r.id+'-'+s[0]+'-'+Math.floor(Date.now()/86400000);
      if(s[1]!=='ok' && !notified.includes(key)){
        var msg=r.name+' - '+s[0]+' - '+(r.nextMileage?Number(r.nextMileage).toLocaleString()+' mi - Actual '+Number(x.odo).toLocaleString()+' mi':r.nextDate||'')+' - '+(r.notes||'');
        showPushNotification('⏰ '+r.name+' '+s[0], msg);
        notified.push(key);
        if(notified.length>50) notified.shift();
        localStorage.setItem('eo_notified', JSON.stringify(notified));
      }
    });
    // También verificar millaje mensual
    var lastMile=localStorage.getItem('eo_last_mile_check')||'';
    var today=new Date().toISOString().slice(0,7);
    if(lastMile!==today && Notification.permission==='granted'){
      var logs=db.mileageLogs.filter(function(l){ return l.vehicleId===selected; });
      var thisMonth=logs.filter(function(l){ return l.date.slice(0,7)===today; });
      if(thisMonth.length===0 && new Date().getDate()>5){
        showPushNotification('🛣️ Millaje mensual', 'No has puesto millaje de '+today+' - Ve a Millas y pon odo REAL - Actual '+Number(x.odo).toLocaleString()+' mi');
        localStorage.setItem('eo_last_mile_check', today);
      }
    }
  }catch(e){ console.log('Check notif error', e); }
}
function enableAutoNotifications(){
  requestNotificationPermission();
  // Check cada 1 hora si hay vencidos
  setInterval(checkAndNotifyReminders, 3600000);
  // Check al iniciar
  setTimeout(checkAndNotifyReminders, 3000);
}
