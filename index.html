function toggleMasterDone(id){
  var item=(db.masterRepairs||[]).find(function(m){return m.id===id&&m.vehicleId===selected;});if(!item)return;

function repairV69Data(){
  if(!confirm('¿Reparar consistencia de datos v69.1? Se guardará respaldo local antes.'))return;
  try{var prev=localStorage.getItem(KEY);if(prev)localStorage.setItem(KEY+'_bak',prev);normalizeDatabaseInPlace();
    // Quitar duplicados exactos de millaje por vehículo/fecha/odo
    var seen={};db.mileageLogs=(db.mileageLogs||[]).filter(function(l){var k=l.vehicleId+'|'+l.date+'|'+Number(l.odo);if(seen[k])return false;seen[k]=1;return true;});
    // Recalcular estado de maestra desde historial vinculado, sin mezclar vehículos
    (db.masterRepairs||[]).forEach(function(m){m.done=false;m.dateDone=null;m.odoDone=null;m.status='pendiente';});
    (db.records||[]).slice().sort(function(a,b){return String(a.date).localeCompare(String(b.date));}).forEach(function(r){if(!r.vehicleId)r.vehicleId=db.vehicles[0].id;var master=null;if(r.masterId)master=(db.masterRepairs||[]).find(function(m){return m.id===r.masterId&&m.vehicleId===r.vehicleId;});if(!master){var n=normalizedText(r.service);master=(db.masterRepairs||[]).find(function(m){return m.vehicleId===r.vehicleId&&normalizedText(m.section)===normalizedText(r.category)&&normalizedText(m.name)===n;});}if(master){r.masterId=master.id;master.done=true;master.dateDone=r.date;master.odoDone=Number(r.odo);master.status='hecho';updateReminderFromService(master.id,r,r.vehicleId);}var old=selected;selected=r.vehicleId;upsertMileageLog(r.date,r.odo,r.service,r.id);selected=old;});
    recalcBudgetSpent();saveLocalOnly();toast('Consistencia v69.1 reparada','ok');closeModal();
  }catch(e){toast('No se pudo reparar: '+e.message,'bad');}
}

function requestNotificationPermission(){
  if(typeof Notification==='undefined' || !('Notification' in window)){
    toast('📱 Este navegador no soporta push, pero te avisaré dentro de la app con toasts','info');
    localStorage.setItem('eo_notif','app_only');
    // Simular notificacion con toast
    try{ checkAndNotifyReminders(); }catch(e){}
    return;
  }
  try{
    if(Notification.permission==='granted'){ toast('🔔 Notificaciones activadas','ok'); localStorage.setItem('eo_notif','granted'); checkAndNotifyReminders(); return; }
    if(Notification.permission!=='denied'){
      Notification.requestPermission().then(function(perm){
        if(perm==='granted'){ toast('🔔 Activadas - Te avisaré de servicios','ok'); localStorage.setItem('eo_notif','granted'); checkAndNotifyReminders(); }
        else { toast('🔔 Permiso denegado - usaré avisos dentro de app','warn'); localStorage.setItem('eo_notif','app_only'); }
      }).catch(function(e){
        toast('🔔 Usaré avisos dentro de app','info'); localStorage.setItem('eo_notif','app_only');
      });
    } else {
      toast('🔔 Bloqueadas en navegador, activaré avisos dentro de app','warn'); localStorage.setItem('eo_notif','app_only');
    }
  }catch(e){
    toast('📱 Notif error: '+(e.message||e)+' - usaré avisos app','warn');
    localStorage.setItem('eo_notif','app_only');
  }
}
function showPushNotification(title, body){
  try{
    if(Notification.permission==='granted'){
      new Notification(title, {body:body, icon:'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>'});
    }
  }catch(e){ console.log('Push error', e); }
  toast(title+' - '+body, body.includes('Vencido')?'bad':'warn');
}

    var rem=db.reminders.filter(function(r){ return r.vehicleId===selected; });
    var notified=JSON.parse(localStorage.getItem('eo_notified')||'[]');
    rem.forEach(function(r){
      var s=reminderStatus(r);
      var key=r.id+'-'+s[0]+'-'+Math.floor(Date.now()/86400000);
      if(s[1]!=='ok' && !notified.includes(key)){
        var msg=r.name+' - '+s[0]+' - '+(r.nextMileage?Number(r.nextMileage).toLocaleString()+' mi - Actual '+Number(x.odo).toLocaleString()+' mi':r.nextDate||'')+' - '+(r.notes||'');
        showPushNotification('⏰ '+r.name+' '+s[0], msg);
        notified.push(key);
        if(notified.length>50) notified.shift();
        localStorage.setItem('eo_notified', JSON.stringify(notified));
      }
    });
    // También verificar millaje mensual
    var lastMile=localStorage.getItem('eo_last_mile_check')||'';
    var today=localDateISO(new Date()).slice(0,7);
    if(lastMile!==today && Notification.permission==='granted'){
      var logs=db.mileageLogs.filter(function(l){ return l.vehicleId===selected; });
      var thisMonth=logs.filter(function(l){ return l.date.slice(0,7)===today; });
      if(thisMonth.length===0 && new Date().getDate()>5){
        showPushNotification('🛣️ Millaje mensual', 'No has puesto millaje de '+today+' - Ve a Millas y pon odo REAL - Actual '+Number(x.odo).toLocaleString()+' mi');
        localStorage.setItem('eo_last_mile_check', today);
      }
    }
  }catch(e){ console.log('Check notif error', e); }
}
