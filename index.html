// ---- DATA + LOGIC (reused from v15) ----

];

seed.reminders=[
  {id:'m1',vehicleId:'v1',name:'Rotación llantas',nextMileage:176500,warnMiles:1000,warnDays:30,type:'Inspección',intervalMiles:7500,status:'pending'},

const INSPECTION_TEMPLATE=[

  {cat:'Frenos',items:['Pastillas del.','Pastillas tras.','Discos','Líquido frenos','Freno mano']},
  {cat:'Suspensión',items:['Amortiguadores del.','Amort. tras.','Bieletas','Bujes barra','Bujes flotantes','Dirección']},
  {cat:'Llantas',items:['Presión 35 PSI','Desgaste','Rotación','P255/60R19']},

  {cat:'Llantas',items:['Presión 35 PSI','Refacción inflada','Gato','Llave cruz']},

];
const PARTS_CATALOG_DEFAULT=[
  {cat:'Motor',name:'Aceite 5W-30',partNumber:'Castrol EDGE',brand:'Castrol',lastPrice:850,where:'AutoZone'},
  {cat:'Motor',name:'Filtro aceite',partNumber:'STP S8765',brand:'STP',lastPrice:180,where:'AutoZone'},
  {cat:'Motor',name:'Bujías',partNumber:'Bosch 9602',brand:'Bosch',lastPrice:420,where:'AutoZone'},
  {cat:'Llantas',name:'Llanta P255/60R19',partNumber:'P255/60R19',brand:'Michelin',lastPrice:3200,where:'Costco'},
];

function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function money(n){return new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0}).format(Number(n)||0)}
function daysBetween(a,b){return Math.ceil((new Date(a)-new Date(b))/86400000)}
function normalize(d){d=d&&typeof d==='object'?d:{};d.vehicles=Array.isArray(d.vehicles)?d.vehicles:[];d.records=Array.isArray(d.records)?d.records:[];d.reminders=Array.isArray(d.reminders)?d.reminders:[];d.issues=Array.isArray(d.issues)?d.issues:[];d.expenses=Array.isArray(d.expenses)?d.expenses:[];d.mileageLogs=Array.isArray(d.mileageLogs)?d.mileageLogs:[];d.inspections=Array.isArray(d.inspections)?d.inspections:[];d.partsCatalog=Array.isArray(d.partsCatalog)?d.partsCatalog:[];d.quickNotes=Array.isArray(d.quickNotes)?d.quickNotes:[];d.travelLogs=Array.isArray(d.travelLogs)?d.travelLogs:[];d.travelChecklists=Array.isArray(d.travelChecklists)?d.travelChecklists:[];d.settings=d.settings&&typeof d.settings==='object'?d.settings:{};return d}
function load(){try{let raw=localStorage.getItem(KEY);if(!raw){for(const k of LEGACY_KEYS){const v=localStorage.getItem(k);if(v){raw=v;break;}}}if(raw){const d=JSON.parse(raw);if(d&&Array.isArray(d.vehicles))return d;}}catch(e){}return JSON.parse(JSON.stringify(seed))}
let db=normalize(load());
if(!db.partsCatalog.length){db.partsCatalog=PARTS_CATALOG_DEFAULT.map((p,i)=>({...p,id:'part-'+i,vehicleId:'v1'}))}
let selected=db.vehicles[0]?.id||null;let tab='resumen';
function v(){return db.vehicles.find(x=>x.id===selected)||db.vehicles[0]||null}
function reminderStatus(r){let x=v();if(!x)return['—','info'];let m=r.nextMileage?Number(r.nextMileage)-Number(x.odo):Infinity;let d=r.nextDate?daysBetween(r.nextDate,today()):Infinity;if(m<0||d<0)return['Vencido','bad'];if(m<=Number(r.warnMiles||1000)||d<=Number(r.warnDays||30))return['Próximo','warn'];return['Al día','ok']}
function toast(msg,type='info'){const root=document.getElementById('toastRoot');const el=document.createElement('div');el.className='toast';el.innerHTML=`<div>${type==='ok'?'✓':type==='bad'?'✕':'ℹ️'}</div><div style="flex:1">${esc(msg)}</div>`;root.appendChild(el);setTimeout(()=>el.remove(),3200)}

function getMonthlyMiles(vehicleId){
  const logs=[...db.mileageLogs.filter(l=>l.vehicleId===vehicleId)].sort((a,b)=>a.date.localeCompare(b.date));
  const res=[];for(let i=1;i<logs.length;i++){const prev=logs[i-1],curr=logs[i];res.push({from:prev.date,to:curr.date,miles:curr.odo-prev.odo,days:daysBetween(curr.date,prev.date)||30})}
  if(logs.length){const last=logs[logs.length-1];const currOdo=v()?.odo||last.odo;const currDate=today();if(currDate!==last.date) res.push({from:last.date,to:currDate,miles:currOdo-last.odo,days:daysBetween(currDate,last.date)||1,current:true})}
  return res;
}
function getAvgMonthlyMiles(vehicleId){const m=getMonthlyMiles(vehicleId);if(!m.length)return 0;const last3=m.slice(-3);return last3.reduce((a,b)=>a+b.miles,0)/last3.length}
function getHealthByCategory(vehicleId){
  const ins=[...db.inspections.filter(i=>i.vehicleId===vehicleId)].sort((a,b)=>b.date.localeCompare(a.date))[0];
  if(!ins||!ins.items.length) return null;
  const byCat={};ins.items.forEach(it=>{if(!byCat[it.cat]) byCat[it.cat]={total:0,ok:0,atencion:0};byCat[it.cat].total++;if(it.status==='ok')byCat[it.cat].ok++;if(it.status==='atencion')byCat[it.cat].atencion++;});
  Object.keys(byCat).forEach(c=>{const d=byCat[c];d.pct=d.total?Math.round(d.ok/d.total*100):0;d.status=d.atencion>0?(d.pct<60?'bad':'warn'):'ok';});
  return byCat;
}

  const monthly=getMonthlyMiles(x.id);const avg=getAvgMonthlyMiles(x.id);const currentMonth=monthly.find(m=>m.current)||monthly[monthly.length-1];const milesThisMonth=currentMonth?currentMonth.miles:0;
  const rec=db.records.filter(r=>r.vehicleId===x.id);const rem=db.reminders.filter(r=>r.vehicleId===x.id);const pending=rem.filter(r=>r.name!=='Actualizar millas mensual'&&reminderStatus(r)[1]!=='ok');
  const health=getHealthByCategory(x.id);

  document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('bn-'+(tab==='resumen'?'resumen':tab==='millas'?'millas':tab==='mantenimiento'?'mantenimiento':tab==='viajes'?'viajes':'mas'))?.classList.add('active');

  let html='';
  if(tab==='resumen'){
    html+=`
      <div class="hero">
        <div class="hero-top"><div><div class="eyebrow">Vehículo principal · v15.5 FIX</div><h2>${esc(x.make)} ${esc(x.model)} ${x.year}</h2><p class="sub" style="margin:2px 0 0">${esc(x.vin||'')} · ${esc(x.engine||'')} · ${esc(x.tire||'')}</p></div><button class="btn-sec" style="padding:8px 12px;font-size:11px" onclick="openVehicleDrawer()">Cambiar</button></div>
        <div class="odo-big">
          <div class="odo-card"><span>ODÓMETRO</span><b>${Number(x.odo).toLocaleString()} ${esc(x.unit||'mi')}</b><small>Actualizado ${db.mileageLogs.slice(-1)[0]?.date||today()}</small></div>
          <div class="odo-card"><span>ESTE MES</span><b style="color:${milesThisMonth<0?'var(--bad)':'var(--text)'}">${milesThisMonth>=0?'+'+milesThisMonth.toLocaleString():'—'}</b><small>Prom ${Math.round(avg)} mi/mes</small></div>
        </div>

function saveMileage(editId){
  const o={date:document.getElementById('m-date').value||today(),odo:+document.getElementById('m-odo').value||0,notes:document.getElementById('m-notes').value||'',vehicleId:selected};
  if(editId){Object.assign(db.mileageLogs.find(x=>x.id===editId),o)}else{o.id='ml-'+Date.now();db.mileageLogs.push(o);if(o.odo>v().odo)v().odo=o.odo}

function openPartForm(){const name=prompt('Refacción?','Filtro aceite'); if(!name) return; db.partsCatalog.push({id:'part-'+Date.now(),vehicleId:selected,cat:'Motor',name,partNumber:'',brand:'',lastPrice:0,where:'AutoZone'}); save();}
function setBudget(){const b=prompt('Presupuesto mensual MXN?',db.settings.monthlyBudget||3000); if(b===null) return; db.settings.monthlyBudget=+b||0; save();}
function exportJSON(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`EO_Garage_v15.1_${today()}.json`;a.click();}
function exportPDFServicios(){const {jsPDF}=window.jspdf;const doc=new jsPDF();const x=v();doc.text(`Servicios pendientes - ${x.make} ${x.model} - ${today()}`,14,20);let y=30;db.reminders.filter(r=>r.vehicleId===x.id).forEach(r=>{doc.text(`${r.name} - ${r.nextMileage||r.nextDate||''} - ${reminderStatus(r)[0]}`,14,y);y+=8;if(y>280){doc.addPage();y=20;}});doc.save(`Servicios_${x.make}_${today()}.pdf`);}

try{render();}catch(e){document.getElementById('appContent').innerHTML='<div class="card-app">Error '+esc(e.message)+'</div>'}
