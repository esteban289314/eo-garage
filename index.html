@font-face {
  font-family: "Optimistic";

@font-face {

  font-style: normal;
  font-weight: 400;

}

}
:where(code, pre, kbd, samp) {

}

  .top-right button{padding:7px 7px!important;min-width:32px}
}

function validateOdoReading(date,odo,vehicleId){

  var before=logs.filter(function(l){return l.date<date;}); var after=logs.filter(function(l){return l.date>date;});
  var maxBefore=before.length?Math.max.apply(null,before.map(function(l){return Number(l.odo);})):null;
  var minAfter=after.length?Math.min.apply(null,after.map(function(l){return Number(l.odo);})):null;
  if(maxBefore!=null&&odo<maxBefore) return 'El odómetro es menor que una lectura anterior ('+maxBefore.toLocaleString()+' mi)';
  if(minAfter!=null&&odo>minAfter) return 'El odómetro es mayor que una lectura posterior ('+minAfter.toLocaleString()+' mi)';
  return '';
}

function requestNotificationPermission(){
  if(typeof Notification==='undefined' || !('Notification' in window)){
    toast('📱 Este navegador no soporta push, pero te avisaré dentro de la app con toasts','info');
    localStorage.setItem('eo_notif','app_only');
    // Simular notificacion con toast
    try{ checkAndNotifyReminders(); }catch(e){}
    return;
  }
  try{
    if(Notification.permission==='granted'){ toast('🔔 Notificaciones activadas','ok'); localStorage.setItem('eo_notif','granted'); checkAndNotifyReminders(); return; }
    if(Notification.permission!=='denied'){
      Notification.requestPermission().then(function(perm){
        if(perm==='granted'){ toast('🔔 Activadas - Te avisaré de servicios','ok'); localStorage.setItem('eo_notif','granted'); checkAndNotifyReminders(); }
        else { toast('🔔 Permiso denegado - usaré avisos dentro de app','warn'); localStorage.setItem('eo_notif','app_only'); }
      }).catch(function(e){
        toast('🔔 Usaré avisos dentro de app','info'); localStorage.setItem('eo_notif','app_only');
      });
    } else {
      toast('🔔 Bloqueadas en navegador, activaré avisos dentro de app','warn'); localStorage.setItem('eo_notif','app_only');
    }
  }catch(e){
    toast('📱 Notif error: '+(e.message||e)+' - usaré avisos app','warn');
    localStorage.setItem('eo_notif','app_only');
  }
}
function showPushNotification(title, body){
  try{
    if(Notification.permission==='granted'){
      new Notification(title, {body:body, icon:'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>'});
    }
  }catch(e){ console.log('Push error', e); }
  toast(title+' - '+body, body.includes('Vencido')?'bad':'warn');
}
function checkAndNotifyReminders(){
  try{
    var x=v(); if(!x) return;
    var rem=db.reminders.filter(function(r){ return r.vehicleId===selected; });
    var notified=JSON.parse(localStorage.getItem('eo_notified')||'[]');
    rem.forEach(function(r){
      var s=reminderStatus(r);
      var key=r.id+'-'+s[0]+'-'+Math.floor(Date.now()/86400000);
      if(s[1]!=='ok' && !notified.includes(key)){
        var msg=r.name+' - '+s[0]+' - '+(r.nextMileage?Number(r.nextMileage).toLocaleString()+' mi - Actual '+Number(x.odo).toLocaleString()+' mi':r.nextDate||'')+' - '+(r.notes||'');
        showPushNotification('⏰ '+r.name+' '+s[0], msg);
        notified.push(key);
        if(notified.length>50) notified.shift();
        localStorage.setItem('eo_notified', JSON.stringify(notified));
      }
    });
    // También verificar millaje mensual
    var lastMile=localStorage.getItem('eo_last_mile_check')||'';
    var today=localDateISO(new Date()).slice(0,7);
    if(lastMile!==today && Notification.permission==='granted'){
      var logs=db.mileageLogs.filter(function(l){ return l.vehicleId===selected; });
      var thisMonth=logs.filter(function(l){ return l.date.slice(0,7)===today; });

  function syncAudit(){

    (db.travelLogs||[]).filter(function(a){return a.vehicleId===selected;}).forEach(function(t){if(t.startDate>today()||(t.endDate&&t.endDate>today()))issues.push('Viaje con fecha futura: '+(t.destination||''));if(t.endOdo!=null&&Number(t.endOdo)<Number(t.startOdo))issues.push('Viaje con odómetro final menor: '+(t.destination||''));});
